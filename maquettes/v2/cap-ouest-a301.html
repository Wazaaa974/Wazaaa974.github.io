body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}

.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px}

.seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;font-weight:500}

.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:transparent;padding:6px 10px;border-radius:999px;font-size:13px}
.chips button.here{border-color:var(--accent);color:var(--accent)}
.toggles{display:flex;gap:4px;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:transparent;padding:6px 10px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px}
.tog::before{content:"";width:9px;height:9px;border-radius:3px;border:1.5px solid var(--muted)}

.id-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

.id-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.id-sub{display:none;font-size:12px;color:var(--muted)}

.fold svg{transition:transform .2s ease}
.id.is-collapsed{padding:8px 8px 8px 12px;gap:3px;cursor:pointer}
.id.is-collapsed .fold svg{transform:rotate(180deg)}
.id.is-collapsed .eyebrow,.id.is-collapsed .facts,.id.is-collapsed .hsp,.id.is-collapsed .src{display:none}
.id.is-collapsed h1{font-size:22px}

.hint{transition:opacity .4s ease}

.sunrow{flex:1 0 100%;display:grid;grid-template-columns:auto minmax(150px,1fr) minmax(150px,1fr) auto;gap:4px 14px;align-items:center;padding:0 2px 7px;border-bottom:1px solid var(--line)}

.suninfo{grid-column:1 / -1;margin:0;font-size:12px;line-height:1.35;color:var(--ink)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
